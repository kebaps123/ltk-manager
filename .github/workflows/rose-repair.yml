name: rose-repair

on:
  push:
    branches: [rose-repair]
    tags: ["rose-repair-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p rose-repair
      - uses: actions/upload-artifact@v4
        with:
          name: rose-repair
          path: target/release/rose-repair.exe
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/rose-repair.exe
          body: |
            Headless LTK Manager repair used by Rose's Marketplace.
            GPL-3.0-or-later. Source: crates/rose-repair in this tag.
